<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>බයිLap.lk — Install your dream &amp; CCTV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F3FA; --card:#FFFFFF; --ink:#221C3C; --ink-soft:#5A5279;
  --violet:#4F2BD9; --violet-soft:#EBE6FB; --teal:#00A98F; --alert:#E0574C;
  --line:#DFD9EC; --radius:14px; --shell:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans Sinhala",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
html[lang="si"] body{font-family:"Noto Sans Sinhala","IBM Plex Sans",system-ui,sans-serif;line-height:1.75}
h1,h2,h3{font-family:"Sora","Noto Sans Sinhala",sans-serif;line-height:1.24;letter-spacing:-0.012em}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);margin:0 0 .3rem}
p{margin:0 0 1rem;max-width:66ch}
a{color:var(--violet)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:var(--shell);margin:0 auto;padding:0 20px}
.section{padding:70px 0}
.section + .section{border-top:1px solid var(--line)}
.lead{color:var(--ink-soft);max-width:58ch}

/* ---------- language gate ---------- */
#langGate{position:fixed;inset:0;z-index:300;background:var(--ink);color:#fff;
  display:none;place-items:center;text-align:center;padding:24px;overflow:hidden}
#langGate.show{display:grid}
#langGate .rings{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;height:760px;opacity:.28;pointer-events:none}
#langGate .rings circle{fill:none;stroke:#7C5CF0;stroke-width:1.2}
.gate-inner{position:relative;max-width:440px}
.gate-inner .mark{width:56px;height:56px;margin:0 auto 20px}
.gate-inner h1{font-size:1.6rem;margin:0 0 4px}
.gate-inner .sub{color:#A99FD4;font-size:1.05rem;margin-bottom:28px}
.gate-btns{display:grid;gap:12px}
.gate-btns button{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.28);color:#fff;
  border-radius:14px;padding:18px;font-size:1.15rem;font-weight:600;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.gate-btns button:hover{background:var(--violet);border-color:var(--violet)}
.gate-note{color:#8B81BC;font-size:.82rem;margin-top:22px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(245,243,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Sora",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--ink)}
.brand svg{width:28px;height:28px;flex:none}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:7px 11px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.92rem}
nav.main a:hover{background:var(--violet-soft)}
#langToggle{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:.86rem;font-weight:600;white-space:nowrap}
#langToggle:hover{border-color:var(--violet);color:var(--violet)}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:600;font-size:.9rem}
.cart-btn .count{background:var(--violet);border-radius:20px;min-width:22px;padding:0 6px;text-align:center;font-size:.8rem}
.menu-toggle{display:none;background:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:78px 0 70px}
.hero .rings{position:absolute;right:-140px;top:50%;transform:translateY(-50%);width:640px;height:640px;opacity:.38;pointer-events:none}
.hero .rings circle{fill:none;stroke:#7C5CF0;stroke-width:1.2}
.hero-inner{position:relative;max-width:640px}
.hero h1{font-size:clamp(2rem,5.6vw,3.3rem);margin:0 0 14px}
.hero p{color:#CFC7EC}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:38px;padding-top:24px;border-top:1px solid rgba(255,255,255,.16)}
.trust div span{display:block;font-family:"Sora","Noto Sans Sinhala",sans-serif;font-size:1.25rem;font-weight:700}
.trust div small{color:#A99FD4}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem;transition:transform .12s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--violet);color:#fff}
.btn-primary:hover{background:#3F1FC4}
.btn-ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-line:hover{border-color:var(--violet);color:var(--violet)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* ---------- filters ---------- */
.shop-top{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:30px;padding:7px 15px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;min-width:240px}
.search input{border:0;outline:0;width:100%;background:none}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s ease}
.pcard:hover,.pcard:focus-visible{border-color:var(--violet);outline:none}
.pcard .thumb{aspect-ratio:4/3;background:var(--violet-soft);position:relative;overflow:hidden}
.pcard .thumb img{width:100%;height:100%;object-fit:cover}
.pcard .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.pcard h3{margin:0;font-size:1rem}
.pcard .desc{color:var(--ink-soft);font-size:.87rem;line-height:1.5;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-family:"Sora",sans-serif;font-weight:700;font-size:1.12rem}
.price s{color:var(--ink-soft);font-weight:400;font-size:.85rem;margin-left:7px}
.stock{font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.in{color:var(--teal)} .low{color:#C98A00} .out{color:var(--alert)}
.pcard .row{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.pcard .row .btn{flex:1;padding:10px 8px;font-size:.85rem}
.tag{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:.72rem;padding:4px 9px;border-radius:6px;font-weight:600}
.soldout-veil{position:absolute;inset:0;background:rgba(34,28,60,.55);display:grid;place-items:center;color:#fff;font-weight:700}

/* ---------- modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,19,45,.55);z-index:90;display:none}
.overlay.open{display:block}
.modal{position:fixed;z-index:100;background:var(--paper);display:none;flex-direction:column}
.modal.open{display:flex}
.modal-center{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(940px,94vw);max-height:90vh;border-radius:18px;overflow:hidden}
.drawer{top:0;right:0;height:100dvh;width:min(430px,100vw);border-left:1px solid var(--line)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.modal-head h3{margin:0;font-size:1.05rem}
.x{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 8px;border-radius:8px}
.x:hover{background:var(--violet-soft)}
.modal-body{overflow:auto;padding:22px;flex:1}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);background:#fff}
.detail{display:grid;grid-template-columns:1.05fr 1fr;gap:26px}
.detail .gal{background:var(--violet-soft);border-radius:12px;overflow:hidden;aspect-ratio:1/1}
.detail .gal img{width:100%;height:100%;object-fit:cover}
.spec{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:.9rem}
.spec td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec td:first-child{color:var(--ink-soft);width:44%}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.qty button{width:38px;height:40px;border:0;background:none;font-size:1.15rem;cursor:pointer}
.qty span{min-width:40px;text-align:center;font-weight:600}

/* ---------- cart ---------- */
.citem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.citem img{width:64px;height:64px;object-fit:cover;border-radius:9px;background:var(--violet-soft)}
.citem h4{margin:0 0 4px;font-size:.93rem;font-weight:600}
.link-btn{background:none;border:0;color:var(--alert);cursor:pointer;font-size:.82rem;padding:0;text-decoration:underline}
.totals{display:flex;justify-content:space-between;font-family:"Sora",sans-serif;font-weight:700;font-size:1.15rem;margin-bottom:12px}
.empty{text-align:center;color:var(--ink-soft);padding:50px 10px}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:.87rem;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.field textarea{min-height:95px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pay{display:flex;flex-direction:column;gap:10px;margin:6px 0 18px}
.pay label{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer}
.pay label:has(input:checked){border-color:var(--violet);background:var(--violet-soft)}
.pay strong{display:block;font-size:.95rem}
.pay small{color:var(--ink-soft)}
.pay-extra{display:none;margin:-8px 0 16px;padding:14px 16px;background:#fff;border:1px dashed var(--line);border-radius:12px;font-size:.88rem}
.pay-extra.show{display:block}
.note{font-size:.85rem;color:var(--ink-soft)}

/* ---------- services ---------- */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin:26px 0}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.svc h3{margin:0 0 6px;font-size:1.02rem}
.svc p{font-size:.9rem;color:var(--ink-soft);margin:0 0 10px}
.svc .from{font-family:"Sora","Noto Sans Sinhala",sans-serif;font-weight:700;color:var(--violet)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.cctv{background:var(--ink);color:#fff}
.cctv .panel{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.cctv .lead,.cctv .svc p,.cctv ol{color:#BCB3E0}
.cctv .svc{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.cctv .svc h3{color:#fff}
.cctv .svc .from{color:#A78BFA}
.cctv .field input,.cctv .field select,.cctv .field textarea{background:rgba(255,255,255,.95);color:var(--ink);border-color:transparent}
.cctv .spec{color:#CFC7EC}
.cctv .spec td{border-color:rgba(255,255,255,.16)}
.cctv .spec td:first-child{color:#9C92C9}

/* ---------- reviews ---------- */
.rev-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.score{font-family:"Sora",sans-serif;font-size:3rem;font-weight:700;line-height:1}
.stars{color:#F5A623;letter-spacing:2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.rev{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.rev .who{display:flex;gap:11px;align-items:center;margin-bottom:9px}
.av{width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.rev p{font-size:.9rem;margin:8px 0 0;color:var(--ink-soft)}
.rev time{font-size:.78rem;color:var(--ink-soft)}

/* ---------- footer ---------- */
footer{background:var(--ink);color:#CFC7EC;padding:52px 0 26px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
footer h4{color:#fff;margin:0 0 12px;font-family:"Sora","Noto Sans Sinhala",sans-serif;font-size:.98rem}
footer a{color:#CFC7EC;text-decoration:none;display:block;padding:3px 0;font-size:.92rem}
footer a:hover{color:#fff}
.paylogos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.paylogos span{border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 11px;font-size:.78rem}
.copy{border-top:1px solid rgba(255,255,255,.15);margin-top:34px;padding-top:18px;font-size:.84rem;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;z-index:200;transition:transform .25s ease;font-size:.9rem;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}

.ok-box{text-align:center;padding:18px 6px}
.ok-box .tick{width:62px;height:62px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:2rem;margin:0 auto 14px}

:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .detail,.split,.fgrid{grid-template-columns:1fr}
  nav.main{display:none;position:absolute;top:66px;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;flex-direction:column}
  nav.main.open{display:flex}
  .menu-toggle{display:block;margin-left:auto}
  .hero .rings{opacity:.2;right:-260px}
  .two{grid-template-columns:1fr}
  #langGate .rings{width:520px;height:520px}
}
</style>
</head>
<body>

<!-- ============ ONE-TIME LANGUAGE GATE ============ -->
<div id="langGate" role="dialog" aria-modal="true" aria-label="Choose language">
  <svg class="rings" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="40"/><circle cx="200" cy="200" r="70"/><circle cx="200" cy="200" r="100"/>
    <circle cx="200" cy="200" r="130"/><circle cx="200" cy="200" r="160"/><circle cx="200" cy="200" r="190"/>
  </svg>
  <div class="gate-inner">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#7C5CF0" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#7C5CF0" stroke-width="2"/>
      <circle cx="20" cy="20" r="6" fill="#7C5CF0"/>
    </svg>
    <h1>බයිLap.lk</h1>
    <div class="sub">භාෂාව තෝරන්න · Choose your language</div>
    <div class="gate-btns">
      <button data-lang="si">සිංහල</button>
      <button data-lang="en">English</button>
    </div>
    <div class="gate-note">ඔබට පසුව මෙනුවෙන් භාෂාව මාරු කරගන්න පුළුවන් · You can switch anytime from the menu</div>
  </div>
</div>

<header>
  <div class="shell bar">
    <a class="brand" href="#top">
      
      බයිLap.lk
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <nav class="main" id="mainNav">
      <a href="#shop" data-i18n="nav.shop"></a>
      <a href="#services" data-i18n="nav.services"></a>
      <a href="#cctv" data-i18n="nav.cctv"></a>
      <a href="#reviews" data-i18n="nav.reviews"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <button id="langToggle" type="button"></button>
<!-- Bootstrap icon class 'bi bi-cart' added here -->
<button class="cart-btn" id="cartBtn" aria-label="Cart"><i class="bi bi-cart"></i><span class="count" id="cartCount">0</span>
</button></div>
</header>

<section class="hero" id="top">
  <svg class="rings" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="40"/><circle cx="200" cy="200" r="70"/><circle cx="200" cy="200" r="100"/>
    <circle cx="200" cy="200" r="130"/><circle cx="200" cy="200" r="160"/><circle cx="200" cy="200" r="190"/>
  </svg>
  <div class="shell hero-inner">
    <h1 data-i18n="hero.h1"></h1>
    <p data-i18n="hero.p"></p>
    <div class="actions">
      <a class="btn btn-primary" href="#shop" data-i18n="hero.cta1"></a>
      <a class="btn btn-ghost" href="#services" data-i18n="hero.cta2"></a>
    </div>
    <div class="trust">
      <div><span id="statProducts">—</span><small data-i18n="hero.s1"></small></div>
      <div><span data-i18n="hero.s2t"></span><small data-i18n="hero.s2"></small></div>
      <div><span data-i18n="hero.s3t"></span><small data-i18n="hero.s3"></small></div>
    </div>
  </div>
</section>

<!-- ================= SHOP ================= -->
<section class="section" id="shop">
  <div class="shell">
    <h2 data-i18n="shop.h2"></h2>
    <p class="lead" data-i18n="shop.lead"></p>
    <div class="shop-top">
      <div class="chips" id="catChips"></div>
      <label class="search">🔍 <input type="search" id="searchInput" data-i18n-ph="shop.searchPh" data-i18n-aria="shop.searchPh"></label>
    </div>
    <div class="grid" id="productGrid"></div>
    <div class="empty" id="noResults" hidden data-i18n="shop.noResults"></div>
  </div>
</section>

<!-- ================= COMPUTER SERVICE ================= -->
<section class="section" id="services">
  <div class="shell">
    <h2 data-i18n="svc.h2"></h2>
    <p class="lead" data-i18n="svc.lead"></p>
    <div class="svc-grid" id="svcGrid"></div>
    <div class="split">
      <div class="panel">
        <h3 style="margin-top:0" data-i18n="svc.formTitle"></h3>
        <form id="serviceForm">
          <div class="two">
            <div class="field"><label for="sv-name" data-i18n="f.name"></label><input id="sv-name" required></div>
            <div class="field"><label for="sv-phone" data-i18n="f.phone"></label><input id="sv-phone" type="tel" required placeholder="07X XXX XXXX"></div>
          </div>
          <div class="field"><label for="sv-type" data-i18n="svc.typeLabel"></label>
            <select id="sv-type" required data-i18n-options="svc.types"></select></div>
          <div class="field"><label for="sv-addr" data-i18n="svc.addrLabel"></label><input id="sv-addr" required></div>
          <div class="two">
            <div class="field"><label for="sv-date" data-i18n="svc.dateLabel"></label><input id="sv-date" type="date"></div>
            <div class="field"><label for="sv-time" data-i18n="svc.timeLabel"></label>
              <select id="sv-time" data-i18n-options="svc.times"></select></div>
          </div>
          <div class="field"><label for="sv-issue" data-i18n="svc.issueLabel"></label><textarea id="sv-issue" data-i18n-ph="svc.issuePh"></textarea></div>
          <button class="btn btn-primary block" type="submit" data-i18n="svc.submit"></button>
        </form>
      </div>
      <div class="panel">
        <h3 style="margin-top:0" data-i18n="svc.howTitle"></h3>
        <ol style="padding-left:20px;color:var(--ink-soft)" id="svcSteps"></ol>
        <p class="note" data-i18n="svc.fee"></p>
      </div>
    </div>
  </div>
</section>

<!-- ================= CCTV ================= -->
<section class="section cctv" id="cctv">
  <div class="shell">
    <h2 style="color:#fff" data-i18n="cctv.h2"></h2>
    <p class="lead" data-i18n="cctv.lead"></p>
    <div class="svc-grid" id="cctvGrid"></div>
    <div class="split">
      <div class="panel">
        <h3 style="margin-top:0" data-i18n="cctv.formTitle"></h3>
        <form id="cctvForm">
          <div class="two">
            <div class="field"><label for="cc-name" data-i18n="f.name"></label><input id="cc-name" required></div>
            <div class="field"><label for="cc-phone" data-i18n="f.phone"></label><input id="cc-phone" type="tel" required></div>
          </div>
          <div class="two">
            <div class="field"><label for="cc-job" data-i18n="cctv.jobLabel"></label>
              <select id="cc-job" required data-i18n-options="cctv.jobs"></select></div>
            <div class="field"><label for="cc-count" data-i18n="cctv.countLabel"></label>
              <select id="cc-count" data-i18n-options="cctv.counts"></select></div>
          </div>
          <div class="field"><label for="cc-place" data-i18n="cctv.placeLabel"></label><input id="cc-place" required data-i18n-ph="cctv.placePh"></div>
          <div class="field"><label for="cc-note" data-i18n="cctv.noteLabel"></label><textarea id="cc-note"></textarea></div>
          <button class="btn btn-primary block" type="submit" data-i18n="cctv.submit"></button>
        </form>
      </div>
      <div class="panel">
        <h3 style="margin-top:0" data-i18n="cctv.whatTitle"></h3>
        <table class="spec" id="cctvSpec"></table>
        <p class="note" style="color:#A99FD4" data-i18n="cctv.note"></p>
      </div>
    </div>
  </div>
</section>

<!-- ================= REVIEWS ================= -->
<section class="section" id="reviews">
  <div class="shell">
    <h2 data-i18n="rev.h2"></h2>
    <p class="lead" data-i18n="rev.lead"></p>
    <div class="rev-head">
      <div>
        <div class="score" id="revScore">—</div>
        <div class="stars" id="revStars"></div>
        <div class="note" id="revCount"></div>
      </div>
      <a class="btn btn-line" id="writeReview" href="#" target="_blank" rel="noopener" data-i18n="rev.write"></a>
    </div>
    <div class="rgrid" id="revGrid"></div>
    <p class="note" id="revSource" style="margin-top:18px"></p>
  </div>
</section>

let lang = null;
let cart = [], orders = [], requests = [];
let buyNowItem = null, currentProduct = null;
let activeCat = "__all", searchTerm = "";

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = (k,vars)=>{
  let s = (I18N[lang] && I18N[lang][k]) ?? (I18N.en[k] ?? k);
  if(vars && typeof s === "string") Object.entries(vars).forEach(([a,b])=> s = s.replaceAll("{"+a+"}", b));
  return s;
};
/* picks the right language out of {en,si} objects; plain strings pass through */
const L = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.en ?? "") : (v ?? "");
const catKey = p => (p.cat && typeof p.cat === "object") ? (p.cat.en || p.cat.si) : p.cat;
const money = n => (lang==="si" ? "රු. " : "Rs. ") + Number(n).toLocaleString("en-LK");

function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), 2600);
}

/* ======================= STORAGE ======================= */
/* Tries the artifact storage API first, then browser storage when the file is
   hosted normally. Both are wrapped so the site still works if neither exists. */
async function store(key, value){
  try{ if(window.storage){ await window.storage.set(key, value); return; } }catch(e){}
  try{ window.localStorage.setItem(key, value); }catch(e){}
}
async function recall(key){
  try{ if(window.storage){ const r = await window.storage.get(key); if(r && r.value != null) return r.value; } }catch(e){}
  try{ const v = window.localStorage.getItem(key); if(v != null) return v; }catch(e){}
  return null;
}
async function saveData(){ await store("බයිLap.lk:data", JSON.stringify({PRODUCTS, orders, requests})); }
async function loadData(){
  const raw = await recall("බයිLap.lk:data");
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    if(Array.isArray(d.PRODUCTS) && d.PRODUCTS.length) PRODUCTS = d.PRODUCTS;
    orders = d.orders || []; requests = d.requests || [];
  }catch(e){}
}

/* ======================= LANGUAGE ======================= */
function applyLang(){
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el=> el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el=> el.placeholder = t(el.dataset.i18nPh));
  $$("[data-i18n-aria]").forEach(el=> el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $$("[data-i18n-options]").forEach(sel=>{
    const opts = t(sel.dataset.i18nOptions), keep = sel.selectedIndex;
    sel.innerHTML = opts.map((o,i)=>`<option${i===0 && o.endsWith("…")?' value=""':''}>${esc(o)}</option>`).join("");
    if(keep >= 0 && keep < opts.length) sel.selectedIndex = keep;
  });
  $("#langToggle").textContent = t("lang.switch");
  $("#svcSteps").innerHTML = t("svc.steps").map(s=>`<li>${esc(s)}</li>`).join("");
  $("#cctvSpec").innerHTML = t("cctv.spec").map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("");
  renderChips(); renderProducts(); renderCards(); renderCart(); renderReviews();
  if($("#adminModal").classList.contains("open") && adminUnlocked) renderAdmin();
}
async function setLang(next, save=true){
  lang = next;
  if(save) await store("බයිLap.lk:lang", next);
  applyLang();
}
$("#langToggle").onclick = ()=> setLang(lang==="si" ? "en" : "si");
$$("#langGate button").forEach(b=> b.onclick = async ()=>{
  await setLang(b.dataset.lang);
  $("#langGate").classList.remove("show");
  document.body.style.overflow = "";
});

/* ======================= HELPERS ======================= */
function imgFor(p){
  if(p.img) return p.img;
  const letter = (p.name||"?").trim().charAt(0);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBE6FB"/><stop offset="1" stop-color="#D5CBF7"/></linearGradient></defs>
    <rect width="400" height="300" fill="url(#g)"/>
    <circle cx="200" cy="150" r="90" fill="none" stroke="#4F2BD9" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="200" cy="150" r="62" fill="none" stroke="#4F2BD9" stroke-opacity=".28" stroke-width="2"/>
    <text x="200" y="168" font-family="Sora,sans-serif" font-size="64" font-weight="700"
      fill="#4F2BD9" fill-opacity=".55" text-anchor="middle">${esc(letter)}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
function stockInfo(p){
  if(p.stock <= 0) return {cls:"out", txt:t("stock.out")};
  if(p.stock <= 3) return {cls:"low", txt:t("stock.low",{n:p.stock})};
  return {cls:"in", txt:t("stock.in",{n:p.stock})};
}

function renderChips(){
  const seen = new Map();
  PRODUCTS.forEach(p=>{ const k = catKey(p); if(k && !seen.has(k)) seen.set(k, L(p.cat)); });
  const items = [["__all", t("shop.all")], ...seen];
  $("#catChips").innerHTML = items.map(([k,label])=>
    `<button class="chip" aria-pressed="${k===activeCat}" data-cat="${esc(k)}">${esc(label)}</button>`).join("");
}
function visibleProducts(){
  const q = searchTerm.trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    const catOk = activeCat==="__all" || catKey(p)===activeCat;
    const hay = (p.name+" "+L(p.desc)+" "+L(p.cat)).toLowerCase();
    return catOk && (!q || hay.includes(q));
  });
}
function renderProducts(){
  const list = visibleProducts();

/* ======================= CART ======================= */
function cartLines(){ return cart.map(c=>({p:PRODUCTS.find(x=>x.id===c.id), qty:c.qty})).filter(l=>l.p); }
function updateCount(){ $("#cartCount").textContent = cart.reduce((s,c)=>s+c.qty,0); }

function addToCart(id, qty=1){
  const p = PRODUCTS.find(x=>x.id===id); if(!p || p.stock<=0) return;
  const line = cart.find(c=>c.id===id);
  const add = Math.min(qty, p.stock - (line?line.qty:0));
  if(add<=0){ toast(t("p.allInCart")); return; }
  if(line) line.qty += add; else cart.push({id, qty:add});
  updateCount(); renderCart(); toast(t("p.added",{name:p.name}));
}
function renderCart(){
  const lines = cartLines();
  if(!lines.length){
    $("#cartBody").innerHTML = `<div class="empty"><p>${esc(t("cart.empty"))}</p><button class="btn btn-line" data-close>${esc(t("cart.browse"))}</button></div>`;
    $("#cartFoot").innerHTML = ""; return;
  }
  $("#cartBody").innerHTML = lines.map(l=>`
    <div class="citem">
      <img src="${esc(imgFor(l.p))}" alt="">
      <div>
        <h4>${esc(l.p.name)}</h4>
        <div class="note">${money(l.p.price)} × ${l.qty}</div>
        <div class="qty" style="margin-top:6px;transform:scale(.88);transform-origin:left">
          <button type="button" data-cq="-" data-id="${l.p.id}" aria-label="−">−</button>
          <span>${l.qty}</span>
          <button type="button" data-cq="+" data-id="${l.p.id}" aria-label="+">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:700">${money(l.p.price*l.qty)}</div>
        <button class="link-btn" data-crm="${l.p.id}">${esc(t("cart.remove"))}</button>
      </div>
    </div>`).join("");
  const total = lines.reduce((s,l)=>s+l.p.price*l.qty,0);
  const fee = total >= CONFIG.freeDeliveryAbove ? 0 : CONFIG.deliveryFee;
  $("#cartFoot").innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px"><span>${esc(t("cart.subtotal"))}</span><span>${money(total)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:10px"><span>${esc(t("cart.delivery"))}</span><span>${fee?money(fee):esc(t("cart.free"))}</span></div>
    <div class="totals"><span>${esc(t("cart.total"))}</span><span>${money(total+fee)}</span></div>
    <button class="btn btn-primary block" id="goCheckout">${esc(t("cart.checkout"))}</button>`;
  $("#goCheckout").onclick = ()=>{ buyNowItem=null; openCheckout(); };
}
document.addEventListener("click", e=>{
  const cq = e.target.closest("[data-cq]");
  if(cq){
    const line = cart.find(c=>c.id===cq.dataset.id);
    const p = PRODUCTS.find(x=>x.id===cq.dataset.id);
    if(line){
      if(cq.dataset.cq==="+") line.qty = Math.min(p.stock, line.qty+1); else line.qty -= 1;
      if(line.qty<=0) cart = cart.filter(c=>c.id!==line.id);
      updateCount(); renderCart();
    }
  }
  const rm = e.target.closest("[data-crm]");
  if(rm){ cart = cart.filter(c=>c.id!==rm.dataset.crm); updateCount(); renderCart(); }
});

/* ======================= DIRECT BUY + CHECKOUT ======================= */
function directBuy(id, qty=1){
  const p = PRODUCTS.find(x=>x.id===id); if(!p || p.stock<=0) return;
  buyNowItem = {id, qty:Math.min(qty, p.stock)};
  openCheckout();
}
function checkoutLines(){
  if(buyNowItem){ const p = PRODUCTS.find(x=>x.id===buyNowItem.id); return p?[{p, qty:buyNowItem.qty}]:[]; }
  return cartLines();
}
function openCheckout(){
  const lines = checkoutLines();

  const sub = lines.reduce((s,l)=>s+l.p.price*l.qty,0);
  const fee = sub >= CONFIG.freeDeliveryAbove ? 0 : CONFIG.deliveryFee;
  const waNum = "0" + CONFIG.whatsapp.slice(2);

  $("#coTitle").textContent = buyNowItem ? t("co.quick") : t("co.title");
  $("#checkoutBody").innerHTML = `
  <div class="detail">
    <form id="orderForm">
      <h3 style="margin-top:0">${esc(t("co.delTitle"))}</h3>
      <div class="two">
        <div class="field"><label for="o-name">${esc(t("f.fullName"))}</label><input id="o-name" required></div>
        <div class="field"><label for="o-phone">${esc(t("f.phone"))}</label><input id="o-phone" type="tel" required placeholder="07X XXX XXXX"></div>
      </div>
      <div class="field"><label for="o-addr">${esc(t("f.addr"))}</label><textarea id="o-addr" required style="min-height:72px"></textarea></div>
      <div class="two">
        <div class="field"><label for="o-city">${esc(t("f.city"))}</label><input id="o-city" required></div>
        <div class="field"><label for="o-email">${esc(t("f.email"))}</label><input id="o-email" type="email"></div>
      </div>
      <h3>${esc(t("co.payTitle"))}</h3>
      <div class="pay">
        <label><input type="radio" name="pay" value="cod" checked><span><strong>${esc(t("pay.cod"))}</strong><small>${esc(t("pay.codSub"))}</small></span></label>
        <label><input type="radio" name="pay" value="bank"><span><strong>${esc(t("pay.bank"))}</strong><small>${esc(t("pay.bankSub"))}</small></span></label>
        <label><input type="radio" name="pay" value="card"><span><strong>${esc(t("pay.card"))}</strong><small>${esc(t("pay.cardSub"))}</small></span></label>
      </div>
      <div class="pay-extra" id="bankBox">
        <strong>${esc(L(CONFIG.bank.bankName))} — ${esc(L(CONFIG.bank.branch))}</strong><br>
        ${esc(t("co.accName"))}: ${esc(CONFIG.bank.accountName)}<br>
        ${esc(t("co.accNo"))}: ${esc(CONFIG.bank.accountNumber)}<br>
        <span class="note">${esc(t("co.bankHint",{n:waNum}))}</span>
      </div>
      <div class="pay-extra" id="cardBox">${esc(t("co.cardHint"))} <span class="note">${esc(t("co.cardHint2"))}</span></div>
      <div class="field"><label for="o-note">${esc(t("co.noteLabel"))}</label><input id="o-note" placeholder="${esc(t("co.notePh"))}"></div>
      <button class="btn btn-primary block" type="submit">${esc(t("co.place"))}</button>
    </form>
    <aside>
      <div class="panel">
        <h3 style="margin-top:0">${esc(t("co.summary"))}</h3>
        ${lines.map(l=>`<div class="citem" style="grid-template-columns:48px 1fr auto">
          <img src="${esc(imgFor(l.p))}" alt="" style="width:48px;height:48px">
          <div><h4>${esc(l.p.name)}</h4><div class="note">${l.qty} × ${money(l.p.price)}</div></div>
          <div style="font-weight:700">${money(l.p.price*l.qty)}</div></div>`).join("")}
        <div style="display:flex;justify-content:space-between;font-size:.9rem;margin:12px 0 4px"><span>${esc(t("cart.subtotal"))}</span><span>${money(sub)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px"><span>${esc(t("cart.delivery"))}</span><span>${fee?money(fee):esc(t("cart.free"))}</span></div>
        <div class="totals" style="margin:0"><span>${esc(t("cart.total"))}</span><span>${money(sub+fee)}</span></div>
      </div>
    </aside>
  </div>`;
  $$("input[name=pay]").forEach(r=> r.addEventListener("change", ()=>{
    $("#bankBox").classList.toggle("show", r.value==="bank" && r.checked);
    $("#cardBox").classList.toggle("show", r.value==="card" && r.checked);
  }));
  $("#orderForm").addEventListener("submit", submitOrder);
  openModal("checkoutModal");
}

async function submitOrder(e){
  e.preventDefault();
  const lines = checkoutLines();
  const sub = lines.reduce((s,l)=>s+l.p.price*l.qty,0);
  const fee = sub >= CONFIG.freeDeliveryAbove ? 0 : CONFIG.deliveryFee;
  const payVal = ($("input[name=pay]:checked")||{}).value || "cod";
  const order = {
    ref:"HT"+Date.now().toString().slice(-6), at:new Date().toLocaleString("en-GB"),
    name:$("#o-name").value, phone:$("#o-phone").value, addr:$("#o-addr").value,
    city:$("#o-city").value, email:$("#o-email").value, note:$("#o-note").value,
    payVal, total:sub+fee, direct:!!buyNowItem, lang,
    items: lines.map(l=>({name:l.p.name, qty:l.qty, price:l.p.price}))
  };
  lines.forEach(l=>{ const p = PRODUCTS.find(x=>x.id===l.p.id); if(p) p.stock = Math.max(0, p.stock - l.qty); });
  orders.unshift(order);
  if(!buyNowItem) cart = [];
  buyNowItem = null;
  updateCount(); renderProducts(); renderCart(); await saveData();

  const payTxt = t("pay."+payVal);
  const waMsg = encodeURIComponent(
    `New order — ${order.ref}\nName: ${order.name}\nPhone: ${order.phone}\nAddress: ${order.addr}, ${order.city}\n` +
    order.items.map(i=>`• ${i.name} × ${i.qty}`).join("\n") +
    `\nPayment: ${payTxt}\nTotal: ${money(order.total)}`);

  $("#coTitle").textContent = t("co.done");
  $("#checkoutBody").innerHTML = `
    <div class="ok-box">
      <div class="tick">✓</div>
      <h2 style="margin:0 0 6px">${esc(t("co.thanks",{name:order.name}))}</h2>
      <p style="margin:0 auto 16px;color:var(--ink-soft)">${esc(t("co.ref",{ref:order.ref, phone:order.phone}))}</p>
      <div class="panel" style="text-align:left;max-width:460px;margin:0 auto 18px">
        <table class="spec" style="margin:0">
          <tr><td>${esc(t("co.payMethod"))}</td><td>${esc(payTxt)}</td></tr>
          <tr><td>${esc(t("cart.total"))}</td><td><strong>${money(order.total)}</strong></td></tr>
          ${payVal==="bank"?`<tr><td>${esc(t("co.bankAcc"))}</td><td>${esc(L(CONFIG.bank.bankName))} · ${esc(CONFIG.bank.accountNumber)}<br><span class="note">${esc(CONFIG.bank.accountName)}</span></td></tr>`:""}
          ${payVal==="card"?`<tr><td>${esc(t("co.next"))}</td><td>${esc(t("co.cardNext"))}</td></tr>`:""}
        </table>
      </div>
      <a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${waMsg}">${esc(t("co.wa"))}</a>
      <button class="btn btn-line" data-close style="margin-left:8px">${esc(t("co.keep"))}</button>
    </div>`;
}

/* ======================= SERVICE / CCTV FORMS ======================= */
function handleRequest(form, typeKey, fields){
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const data = {}; fields.forEach(f=> data[f.k] = $(f.sel).value);
    const req = {ref:"RQ"+Date.now().toString().slice(-6), type:t(typeKey), at:new Date().toLocaleString("en-GB"), data};
    requests.unshift(req); await saveData();
    const msg = encodeURIComponent(`${req.type} ${t("req.label")} — ${req.ref}\n` +
      fields.map(f=>`${f.label}: ${data[f.k]}`).join("\n"));
    form.reset(); applyLang();
    toast(t("req.sent"));
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${msg}`, "_blank", "noopener");
  });
}
handleRequest($("#serviceForm"), "svc.reqType", [
  {k:"name",sel:"#sv-name",label:"Name"},{k:"phone",sel:"#sv-phone",label:"Phone"},
  {k:"type",sel:"#sv-type",label:"Service"},{k:"addr",sel:"#sv-addr",label:"Address"},
  {k:"date",sel:"#sv-date",label:"Date"},{k:"time",sel:"#sv-time",label:"Time"},{k:"issue",sel:"#sv-issue",label:"Problem"}
]);
handleRequest($("#cctvForm"), "nav.cctv", [
  {k:"name",sel:"#cc-name",label:"Name"},{k:"phone",sel:"#cc-phone",label:"Phone"},
  {k:"job",sel:"#cc-job",label:"Job"},{k:"count",sel:"#cc-count",label:"Cameras"},
  {k:"place",sel:"#cc-place",label:"Property"},{k:"note",sel:"#cc-note",label:"Notes"}
]);

/* ======================= GOOGLE REVIEWS ======================= */
let liveReviews = null, liveAvg = 0, liveTotal = 0, revSourceKey = "rev.sample";
const starStr = n => "★".repeat(Math.round(n)) + "☆".repeat(5-Math.round(n));

function renderReviews(){
  const list = liveReviews || SAMPLE_REVIEWS;
  const avg = liveReviews ? liveAvg : list.reduce((s,r)=>s+r.rating,0)/list.length;
  const total = liveReviews ? liveTotal : list.length;
  $("#revScore").textContent = avg.toFixed(1);
  $("#revStars").textContent = starStr(avg);
  $("#revCount").textContent = t("rev.count",{n:total});
  $("#revGrid").innerHTML = list.map(r=>`
    <article class="rev">
      <div class="who"><div class="av">${esc(r.author.charAt(0))}</div>
        <div><strong>${esc(r.author)}</strong><br><time>${esc(L(r.time))}</time></div></div>
      <div class="stars">${starStr(r.rating)}</div>
      <p>${esc(L(r.text))}</p>
    </article>`).join("");
  $("#revSource").textContent = t(revSourceKey);
  $("#writeReview").href = CONFIG.google.placeId
    ? `https://search.google.com/local/writereview?placeid=${CONFIG.google.placeId}`
    : CONFIG.google.writeReviewUrl;
}
async function loadGoogleReviews(){
  const {placeId, apiKey} = CONFIG.google;
  if(!placeId || !apiKey){ revSourceKey = "rev.sample"; renderReviews(); return; }
  try{
    const res = await fetch(`https://places.googleapis.com/v1/places/${placeId}?fields=rating,userRatingCount,reviews&key=${apiKey}`);
    const d = await res.json();
    const revs = (d.reviews||[]).map(r=>({
      author: r.authorAttribution?.displayName || "Google user",
      rating: r.rating || 5,
      time: r.relativePublishTimeDescription || "",
      text: r.originalText?.text || r.text?.text || ""
    }));
    if(!revs.length) throw new Error("none");
    liveReviews = revs; liveAvg = d.rating || 5; liveTotal = d.userRatingCount || revs.length;
    revSourceKey = "rev.live";
  }catch(err){ revSourceKey = "rev.fail"; }
  renderReviews();
}

/* ======================= EVENTS ======================= */
document.addEventListener("click", e=>{
  const act = e.target.closest("[data-act]");
  if(act){ e.stopPropagation();
    if(act.dataset.act==="add") addToCart(act.dataset.id,1);
    if(act.dataset.act==="buy") directBuy(act.dataset.id,1);
    return; }
  const card = e.target.closest(".pcard");
  if(card){ openProduct(card.dataset.id); return; }
  const chip = e.target.closest(".chip");
  if(chip){ activeCat = chip.dataset.cat; renderChips(); renderProducts(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && document.activeElement.classList.contains("pcard"))
    openProduct(document.activeElement.dataset.id);
});
$("#searchInput").addEventListener("input", e=>{ searchTerm = e.target.value; renderProducts(); });
$("#cartBtn").onclick = ()=>{ renderCart(); openModal("cartDrawer"); };
$("#menuToggle").onclick = ()=> $("#mainNav").classList.toggle("open");
$$("nav.main a").forEach(a=> a.addEventListener("click", ()=> $("#mainNav").classList.remove("open")));
$("#year").textContent = new Date().getFullYear();

/* ======================= INIT ======================= */
(async function init(){
  const saved = await recall("බයිLap.lk:lang");
  await loadData();
  if(saved === "si" || saved === "en"){
    await setLang(saved, false);                 // returning visitor — no gate
  }else{
    lang = CONFIG.defaultLang; applyLang();      // render behind the gate
    $("#langGate").classList.add("show");
    document.body.style.overflow = "hidden";
    setTimeout(()=> $("#langGate button").focus(), 80);
  }
  updateCount();
  loadGoogleReviews();
})();
</script>
