<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>බයිLap.lk — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
  :root {
    --ink: #1A1533; /* Darkened slightly for better glass contrast */
    --violet: #4F2BD9;
    --violet-soft: #EBE6FB;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--ink);
    background-image: radial-gradient(rgba(124, 92, 240, 0.2) 1px, transparent 1px);
    background-size: 35px 35px;
    color: #fff;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  h1, h2, h3 { font-family: "Sora", sans-serif; }

  /* Background Rings Animation */
  .rings {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1100px;
    height: 1100px;
    opacity: 0.4; /* Increased for better blur visibility */
    pointer-events: none;
    animation: spin 90s linear infinite;
  }
  .rings circle {
    fill: none;
    stroke: #7C5CF0;
    stroke-width: 1.5;
  }
  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* Floating Tech Icons Background */
  .bg-icons {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .bg-icons i {
    position: absolute;
    color: #A78BFA;
    opacity: 0.15; /* Increased for better blur visibility */
    text-shadow: 0 0 35px rgba(124, 92, 240, 1);
  }
  .bg-icon-1 { top: 10%; left: 10%; font-size: 5rem; animation: float1 8s infinite ease-in-out; }
  .bg-icon-2 { top: 20%; right: 12%; font-size: 4.5rem; animation: float2 10s infinite ease-in-out; }
  .bg-icon-3 { bottom: 15%; left: 8%; font-size: 6rem; animation: float1 12s infinite ease-in-out; }
  .bg-icon-4 { bottom: 25%; right: 10%; font-size: 4rem; animation: float2 9s infinite ease-in-out; }
  .bg-icon-5 { top: 50%; left: 5%; font-size: 3.5rem; animation: float1 7s infinite ease-in-out; }
  .bg-icon-6 { top: 40%; right: 5%; font-size: 5.5rem; animation: float2 11s infinite ease-in-out; }
  .bg-icon-7 { bottom: 5%; right: 30%; font-size: 4rem; animation: float1 9s infinite ease-in-out; }

  @keyframes float1 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-25px) rotate(10deg); }
  }
  @keyframes float2 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(20px) rotate(-10deg); }
  }

  /* Main Container */
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px 20px;
    max-width: 650px;
    width: 100%;
    animation: fadeInUp 1s ease-out;
  }

  /* Premium Glassmorphism Card */
  .content-card {
    background: rgba(34, 28, 60, 0.65); /* Transparent dark purple */
    backdrop-filter: blur(20px); /* The Glass Blur */
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18); /* Light white edge */
    border-radius: 24px;
    padding: 50px 40px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 30px rgba(124, 92, 240, 0.1);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Logo */
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 40px;
  }
  .logo svg { width: 56px; height: 56px; filter: drop-shadow(0 0 8px rgba(124, 92, 240, 0.6)); }
  .logo span {
    font-family: "Sora", sans-serif;
    font-weight: 700;
    font-size: 2.2rem;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  /* Gradient Heading */
  h1 {
    font-size: 3.5rem;
    line-height: 1.15;
    margin-bottom: 20px;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #EBE6FB 0%, #7C5CF0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  /* Subtitle */
  .subtitle {
    color: #CFC7EC;
    font-size: 1.2rem;
    margin-bottom: 40px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }

  /* Countdown Timer */
  .countdown {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 48px;
  }
  .time-box {
    /* Inner Glass Effect */
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 20px 16px;
    min-width: 90px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .time-box:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 10px 20px rgba(124, 92, 240, 0.3);
  }
  .time-val {
    font-family: "Sora", sans-serif;
    font-size: 2.8rem;
    font-weight: 700;
    display: block;
    line-height: 1;
    margin-bottom: 8px;
    color: var(--violet-soft);
    text-shadow: 0 2px 5px rgba(79, 43, 217, 0.5);
  }
  .time-label {
    font-size: 0.85rem;
    color: #A99FD4;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  /* Action Area */
  .notify-text {
    color: #A99FD4;
    margin-bottom: 24px;
    font-size: 1.1rem;
  }
  
  /* Call Button with Glass & Shine */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    /* Glass Button */
    background: rgba(79, 43, 217, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    padding: 18px 36px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.2rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px rgba(79, 43, 217, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    margin-bottom: 35px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .cta-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 35px rgba(79, 43, 217, 0.7);
    background: rgba(79, 43, 217, 1);
    color: #fff;
  }
  /* Shine sweep effect */
  .cta-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    animation: shine 4s infinite;
  }
  @keyframes shine {
    0% { left: -100%; }
    20% { left: 150%; }
    100% { left: 150%; }
  }
  .cta-btn i, .cta-btn span { position: relative; z-index: 2; }

  /* Social Links Glass */
  .social-links {
    display: flex;
    justify-content: center;
    gap: 18px;
  }
  .social-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border: 1.5px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 1.4rem;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .social-links a:hover {
    background: rgba(79, 43, 217, 0.8);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(79, 43, 217, 0.5);
    color: #fff;
  }

  /* ================= MOBILE VIEW ================= */
  @media (max-width: 768px) {
    body {
      background-size: 30px 30px; 
    }
    
    .rings {
      width: 600px;
      height: 600px;
      opacity: 0.3;
    }

    .bg-icons i { opacity: 0.08; text-shadow: 0 0 15px rgba(124, 92, 240, 0.5); }
    .bg-icon-1 { top: 3%; left: 5%; font-size: 3rem; }
    .bg-icon-2 { top: 5%; right: 5%; font-size: 2.5rem; }
    .bg-icon-3 { bottom: 5%; left: 5%; font-size: 3.5rem; }
    .bg-icon-4 { bottom: 8%; right: 5%; font-size: 2.5rem; }
    .bg-icon-5, .bg-icon-6, .bg-icon-7 { display: none; }

    /* Glass effect stays but padding adjusts for mobile */
    .content-card {
      padding: 35px 20px;
      border-radius: 20px;
      backdrop-filter: blur(15px); /* Slightly less blur for performance */
      -webkit-backdrop-filter: blur(15px);
    }

    .container {
      padding: 15px;
    }

    .logo svg { width: 44px; height: 44px; }
    .logo span { font-size: 1.8rem; }
    
    h1 { font-size: 2.4rem; }
    .subtitle { font-size: 1rem; margin-bottom: 30px; }

    .countdown { gap: 10px; margin-bottom: 35px; }
    .time-box { 
      min-width: 70px; 
      padding: 14px 10px; 
      border-radius: 12px; 
    }
    .time-val { font-size: 2rem; margin-bottom: 4px; }
    .time-label { font-size: 0.7rem; }

    .notify-text { font-size: 1rem; margin-bottom: 18px; }
    
    .cta-btn { 
      width: 100%; 
      justify-content: center; 
      font-size: 1.1rem; 
      padding: 16px; 
      margin-bottom: 25px;
    }

    .social-links a { width: 46px; height: 46px; font-size: 1.2rem; }
  }
</style>
</head>
<body>

<!-- Animated Background Rings -->
<svg class="rings" viewBox="0 0 400 400" aria-hidden="true">
  <circle cx="200" cy="200" r="40"/>
  <circle cx="200" cy="200" r="70"/>
  <circle cx="200" cy="200" r="100"/>
  <circle cx="200" cy="200" r="130"/>
  <circle cx="200" cy="200" r="160"/>
  <circle cx="200" cy="200" r="190"/>
</svg>

<!-- Floating Tech Icons Background -->
<div class="bg-icons">
  <i class="bi bi-laptop bg-icon-1"></i>
  <i class="bi bi-camera-video-fill bg-icon-2"></i>
  <i class="bi bi-pc-display bg-icon-3"></i>
  <i class="bi bi-router-fill bg-icon-4"></i>
  <i class="bi bi-memory bg-icon-5"></i>
  <i class="bi bi-hdd-fill bg-icon-6"></i>
  <i class="bi bi-motherboard-fill bg-icon-7"></i>
</div>

<div class="container">
  <div class="content-card">
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#7C5CF0" stroke-width="2"/>
        <circle cx="20" cy="20" r="12" fill="none" stroke="#7C5CF0" stroke-width="2"/>
        <circle cx="20" cy="20" r="6" fill="#7C5CF0"/>
      </svg>
      <span>බයිLap.lk</span>
    </div>

    <h1>Coming Soon</h1>
    <p class="subtitle">Our online store for computer gear, CCTV, and on-site technician services is almost ready.</p>

    <div class="countdown">
      <div class="time-box">
        <span class="time-val" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <div class="time-box">
        <span class="time-val" id="hours">00</span>
        <span class="time-label">Hrs</span>
      </div>
      <div class="time-box">
        <span class="time-val" id="minutes">00</span>
        <span class="time-label">Min</span>
      </div>
      <div class="time-box">
        <span class="time-val" id="seconds">00</span>
        <span class="time-label">Sec</span>
      </div>
    </div>

    <p class="notify-text">Need something now? Get in touch!</p>
    
    <!-- Call Us Button -->
    <a href="tel:+94741302525" class="cta-btn">
      <i class="bi bi-telephone-fill"></i>
      <span>Call Us</span>
    </a>

    <div class="social-links">
      <!-- Replace '#' with your actual URLs -->
      <a href="https://www.facebook.com/profile.php?id=61558492247169" target="_blank" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="https://www.instagram.com/hypnotech.lk/" target="_blank" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
      <a href="https://wa.me/94741302525" target="_blank" aria-label="WhatsApp"><i class="bi bi-whatsapp"></i></a>
    </div>
  </div>
</div>

<script>
  // ===== COUNTDOWN TIMER =====
  const launchDate = new Date();
  launchDate.setDate(launchDate.getDate() + 30); // 14 days from now
  launchDate.setHours(0, 0, 0, 0);

  function updateCountdown() {
    const now = new Date();
    const diff = launchDate - now;

    if (diff <= 0) {
      document.getElementById('days').innerText = '00';
      document.getElementById('hours').innerText = '00';
      document.getElementById('minutes').innerText = '00';
      document.getElementById('seconds').innerText = '00';
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('days').innerText = d.toString().padStart(2, '0');
    document.getElementById('hours').innerText = h.toString().padStart(2, '0');
    document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
    document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();
</script>
</body>
</html>
